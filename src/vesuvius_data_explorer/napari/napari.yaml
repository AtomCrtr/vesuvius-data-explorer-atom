name: vesuvius-data-explorer
display_name: Vesuvius Data Explorer
schema_version: 0.2.1
contributions:
  commands:
    - id: vesuvius-data-explorer.get_reader
      title: Ouvrir un volume OME-Zarr local
      python_name: vesuvius_data_explorer.napari.reader:napari_get_reader
    - id: vesuvius-data-explorer.open_volume
      title: Ouvrir un volume
      python_name: vesuvius_data_explorer.napari.widget:OpenVolumeWidget
    - id: vesuvius-data-explorer.quality_control
      title: Contrôle qualité
      python_name: vesuvius_data_explorer.napari.qc_widget:QCWidget
  readers:
    - command: vesuvius-data-explorer.get_reader
      filename_patterns: ['*.zarr']
      accepts_directories: true
  widgets:
    - command: vesuvius-data-explorer.open_volume
      display_name: Vesuvius — Ouvrir un volume
    - command: vesuvius-data-explorer.quality_control
      display_name: Vesuvius — Contrôle qualité
