name: Network
# Real public data (S3 / HTTPS): weekly and on demand, not on every push, so that a network or
# bucket incident never blocks a pull request. Synthetic tests run in tests.yml.
on:
  schedule:
    - cron: '17 4 * * 1'  # Mondays, 04:17 UTC
  workflow_dispatch:
jobs:
  real-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev,vcdelta3d]'
      - name: Real volumes, catalogue, segments and alignment (public S3 and official HTTPS)
        run: pytest -q -m network -rs
